  /config:
    get:
      tags: [platform]
      summary: 读取配置
      description: |
        返回生效配置（对应 docs/05 §4.3、§2.13）：与 docs/01 §9 结构对应，密钥字段一律脱敏。
        响应 `data` 为 Config；`server.host/port` 等修改需重启生效。
      operationId: getConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      x-side-effects: []
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, CONFIG_INVALID, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 生效配置（脱敏）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Config'
              examples:
                config:
                  summary: 生效配置（docs/05 §2.13 示例）
                  value:
                    ok: true
                    data:
                      server:
                        host: 127.0.0.1
                        port: 8710
                        allowRemote: false
                      storage:
                        dataDir: /home/<user>/.local/share/feige-outbound
                        dbFile: fop.db
                        audioDir: audio
                      browser:
                        headless: false
                        profileRoot: /home/<user>/.local/share/feige-outbound/profiles
                        executablePathMasked: null
                      dial:
                        windowStart: "07:50"
                        windowEnd: "22:00"
                        timezone: Asia/Shanghai
                        scheduleOutsideWindow: true
                      limits:
                        perAccountConcurrency: 1
                        globalConcurrency: 8
                        upstreamReadQps: 5
                        dialCooldownMs: 60000
                        apiQps: 100
                      sync:
                        intervalMs: 60000
                        pageSize: 100
                        lookbackDays: 7
                      pipeline:
                        asr: {provider: minimax, baseUrl: 'https://api.minimax.cn', model: asr-1.0, language: zh, chunkSeconds: 420, concurrency: 2}
                        analysis: {provider: deepseek, baseUrl: 'https://api.deepseek.com', model: deepseek-chat, escalateModel: deepseek-v4-pro, promptVersion: analysis-v1, temperature: 0.2, maxTokens: 2000, concurrency: 8}
                        roleMapping: {method: auto, llmVerify: true}
                      events:
                        sseHeartbeatMs: 15000
                        webhooks: []
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [platform]
      summary: 更新配置
      description: |
        JSON Merge Patch（RFC 7386）语义：对象递归合并；显式 `null` 删除该配置项并回落默认值；数组整体替换。
        仅接受 docs/05 §2.13 Config 中的非密钥字段，对应 docs/05 §4.4；密钥字段只读，
        尝试修改返回 400 `CONFIG_INVALID`（`details.readonlyFields`）。
        修改 `server.host/port` 需重启生效：响应 `data.restartRequired=true`。
        校验要点：`windowStart < windowEnd`；`sync.pageSize ∈ [10,100]`；`sync.intervalMs ≥ 10000`；
        `limits.perAccountConcurrency=1`（v1 回拨模式固定，其他值 → `VALIDATION_FAILED`）。
      operationId: patchConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPatch'
            examples:
              partialUpdate:
                summary: 局部更新（docs/05 §4.4 示例）
                value:
                  dial:
                    scheduleOutsideWindow: false
                  sync:
                    intervalMs: 120000
      x-side-effects: [modifies-config, may-require-restart]
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, INVALID_REQUEST, VALIDATION_FAILED, CONFIG_INVALID, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 完整生效配置 + restartRequired
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfigPatchResult'
              examples:
                updated:
                  summary: 更新成功（data = 完整 Config + restartRequired；此处省略重复的完整 Config 字段示例）
                  value:
                    ok: true
                    data:
                      server: {host: 127.0.0.1, port: 8710, allowRemote: false}
                      storage: {dataDir: /home/<user>/.local/share/feige-outbound, dbFile: fop.db, audioDir: audio}
                      browser: {headless: false, profileRoot: /home/<user>/.local/share/feige-outbound/profiles, executablePathMasked: null}
                      dial: {windowStart: "07:50", windowEnd: "22:00", timezone: Asia/Shanghai, scheduleOutsideWindow: false}
                      limits: {perAccountConcurrency: 1, globalConcurrency: 8, upstreamReadQps: 5, dialCooldownMs: 60000, apiQps: 100}
                      sync: {intervalMs: 120000, pageSize: 100, lookbackDays: 7}
                      pipeline:
                        asr: {provider: minimax, baseUrl: 'https://api.minimax.cn', model: asr-1.0, language: zh, chunkSeconds: 420, concurrency: 2}
                        analysis: {provider: deepseek, baseUrl: 'https://api.deepseek.com', model: deepseek-chat, escalateModel: deepseek-v4-pro, promptVersion: analysis-v1, temperature: 0.2, maxTokens: 2000, concurrency: 8}
                        roleMapping: {method: auto, llmVerify: true}
                      events: {sseHeartbeatMs: 15000, webhooks: []}
                      restartRequired: false
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts:
    get:
      tags: [accounts]
      summary: 账号列表
      description: |
        账号列表 + 健康摘要，对应 docs/05 §5.1。按本地账号池分页返回 AccountSummary（docs/05 §2.2）：
        `meta.pagination` 存在；本地统计字段 `stats` 来自本地库，非上游实时值。
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: enabled
          in: query
          required: false
          description: 过滤启用状态
          schema:
            type: boolean
        - name: state
          in: query
          required: false
          description: 过滤账号状态（逗号分隔，如 `online,expired`；取值见 AccountState）
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          required: false
          description: 每页条数（默认 20；账号数 ≤200 时可传 200）
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      x-side-effects: []
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, VALIDATION_FAILED, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 账号列表（分页）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccountSummary'
                  - type: object
                    required: [meta]
                    properties:
                      meta:
                        $ref: '#/components/schemas/PagedMeta'
              examples:
                accounts:
                  summary: 账号列表（字段均来自 docs/05 §2.2，号码脱敏）
                  value:
                    ok: true
                    data:
                      - accountId: main
                        displayName: 主账号
                        upstreamUsernameMasked: "156****0075"
                        upstreamUserId: "1001"
                        tenantCode: "24421"
                        enterpriseName: 示例企业
                        realName: 坐席A
                        dialMode: callback
                        line:
                          lineId: "9"
                          lineName: 电信回拨
                          mode: 1
                        enabled: true
                        state: online
                        jwtExpiresAt: "2026-11-21T09:00:00+08:00"
                        lastLoginAt: "2026-11-14T08:00:00+08:00"
                        lastCheckedAt: "2026-11-14T09:59:50+08:00"
                        lastError: null
                        stats:
                          totalCalls: 1073
                          calls24h: 12
                        createdAt: "2026-11-01T09:00:00+08:00"
                        updatedAt: "2026-11-14T09:59:50+08:00"
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
                      pagination:
                        page: 1
                        size: 20
                        total: 1
                        totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [accounts]
      summary: 注册账号
      description: |
        注册本地账号，对应 docs/05 §5.2。凭证写入加密存储、不落明文，响应不回传密码/手机号明文。
        注册后不会自动登录；需调用 POST /accounts/{accountId}/login。
        字段非法或 `accountId` 已存在时返回 400 `VALIDATION_FAILED`（`details.fields[]` 指明非法/重复字段，docs/05 §5.2）。
      operationId: createAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      x-side-effects: [writes-config, writes-encrypted-credentials, creates-browser-profile]
      x-idempotent: false
      x-error-codes: [UNAUTHORIZED, INVALID_REQUEST, VALIDATION_FAILED, CONFIG_INVALID, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '201':
          description: 账号已注册
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountCreateResult'
              examples:
                created:
                  summary: 注册成功（docs/05 §5.2 示例）
                  value:
                    ok: true
                    data:
                      accountId: main
                      displayName: 主账号
                      upstreamUsernameMasked: "156****0075"
                      enabled: true
                      state: unknown
                      dialMode: callback
                      createdAt: "2026-11-14T10:00:00+08:00"
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/PathAccountId'
    get:
      tags: [accounts]
      summary: 账号详情
      description: |
        账号详情，对应 docs/05 §5.3。响应 `data` 为 AccountDetail（= AccountSummary + config/session/sync/recentJobs，docs/05 §2.3）。
      operationId: getAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      x-side-effects: []
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, ACCOUNT_NOT_FOUND, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 账号详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [accounts]
      summary: 更新账号
      description: |
        更新账号（字段均可选），请求体按 JSON Merge Patch（RFC 7386）语义局部更新，对应 docs/05 §5.4。
        `password` 为 write-only 轮换凭证：
        修改后清除现有会话，下次调用需重新登录（可选 `?relogin=true` 立即触发重登）。
        `enabled=false` 停止调度与同步、保留数据；正在进行的呼出不受影响。
      operationId: updateAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: relogin
          in: query
          required: false
          description: 修改 password 后是否立即触发重新登录（默认 false）
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      x-side-effects: [modifies-config, may-clear-session, may-trigger-relogin]
      x-idempotent: false
      x-error-codes: [UNAUTHORIZED, ACCOUNT_NOT_FOUND, VALIDATION_FAILED, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 更新后的账号详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [accounts]
      summary: 移除账号
      description: |
        移除本地账号，对应 docs/05 §5.5。默认仅删除账号配置/凭证/浏览器 profile，历史数据保留
        （标记 accountDeletedAt，列表仍可查）；`purgeData=true` 时级联删除该账号全部话单/录音/转写/事件/作业
        （不可恢复，需同时传 `confirm=PURGE:<accountId>`），并写审计日志。
      operationId: deleteAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: purgeData
          in: query
          required: false
          description: true=删除该账号全部历史数据（不可恢复）
          schema:
            type: boolean
            default: false
        - name: confirm
          in: query
          required: false
          description: '`purgeData=true` 时必填，值必须为 `PURGE:<accountId>`（条件必填，OpenAPI 3.1 无法在参数层强制表达）'
          schema:
            type: string
      x-side-effects: [deletes-config, deletes-credentials, deletes-browser-profile, may-purge-history-data]
      x-idempotent: false
      x-error-codes: [UNAUTHORIZED, ACCOUNT_NOT_FOUND, VALIDATION_FAILED, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '204':
          description: 账号已移除（无内容）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/{accountId}/login:
    parameters:
      - $ref: '#/components/parameters/PathAccountId'
    post:
      tags: [accounts]
      summary: 登录
      description: |
        触发自动登录（浏览器 + 阿里云滑块），对应 docs/05 §5.6。`wait=true`（默认）同步等待登录结果并返回
        AccountLoginResult；`wait=false` 返回 202 受理（`data.loginJobId` + `pollUrl`）。
        已有登录作业在跑 → 409 `ACCOUNT_LOGIN_IN_PROGRESS`（`details.loginJobId`）；
        滑块失败/密码错误/二次验证 → 422 `ACCOUNT_LOGIN_FAILED`（`details.reason`）。
      operationId: loginAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        description: 省略时全部字段取默认值（wait=true / timeoutMs=120000 / force=false）
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLoginRequest'
      x-side-effects: [starts-browser, writes-session-state, calls-upstream-login]
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, ACCOUNT_NOT_FOUND, ACCOUNT_LOGIN_IN_PROGRESS, ACCOUNT_LOGIN_FAILED, UPSTREAM_UNREACHABLE, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 登录完成（wait=true）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountLoginResult'
              examples:
                loggedIn:
                  summary: 登录成功（docs/05 §5.6 示例）
                  value:
                    ok: true
                    data:
                      accountId: main
                      state: online
                      loggedIn: true
                      jwtExpiresAt: "2026-11-21T10:00:00+08:00"
                      loginJobId: job_01J8Z3K5T9QW2M4R7X1C6V0B8N
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
                      idempotencyReplayed: false
        '202':
          description: 已受理登录作业（wait=false）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountLoginAccepted'
              examples:
                accepted:
                  summary: 异步受理（docs/05 §5.6 示例）
                  value:
                    ok: true
                    data:
                      loginJobId: job_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      status: queued
                      pollUrl: /api/v1/jobs/job_01J8Z3K5T9QW2M4R7X1C6V0B8N
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /accounts/{accountId}/logout:
    parameters:
      - $ref: '#/components/parameters/PathAccountId'
    post:
      tags: [accounts]
      summary: 退出登录
