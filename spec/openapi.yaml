                  value:
                    ok: true
                    data:
                      jobId: job_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      type: sync
                      mode: incremental
                      accountId: null
                      status: queued
                      pollUrl: /api/v1/jobs/job_01J8Z3K5T9QW2M4R7X1C6V0B8N
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
        '200':
          description: 同步完成（wait=true；data = JobDetail）
