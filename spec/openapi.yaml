        `Cache-Control: no-cache`、`Connection: keep-alive`；每 15s 发送 `: ping` 保活。
        建连后不回放历史：客户端先用 `GET /events?since=` 补齐，再带 `Last-Event-ID` 续传；
        若该事件已不可得，服务端发送 `event: stream.reset` 提示重新拉历史。断线按指数退避重连（1s→30s）。
        认证在 SSE 建连前校验；失败返回 401 `UNAUTHORIZED`。
