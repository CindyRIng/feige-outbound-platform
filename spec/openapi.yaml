        - name: accountId
          in: query
          required: false
          description: 账号过滤
          schema:
            type: string
        - name: callId
          in: query
          required: false
          description: 话单过滤
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: 续传游标（最近一次收到的事件 eventId）；缺省从当前时刻开始推送
