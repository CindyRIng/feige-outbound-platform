      description: |
        触发同步作业（增量/全量/回填），对应 docs/05 §7.1。幂等：相同 `mode+accountId` 在 10s 内
        重复触发会合并/返回同一 jobId。`wait=true` 时同步等待作业结束（上限 `timeoutMs`），完成返回 200 + JobDetail；
        否则返回 202 受理。全部账号都不可达时返回 502 `UPSTREAM_UNREACHABLE`；
        无有效会话返回 400 `ACCOUNT_LOGIN_REQUIRED`（`details.accounts[]`）。
        `mode=full` 完成后会自动为历史话单入队 asr/analysis 作业（全量回补，不设预算上限但记录用量，进度见 /jobs）。
      operationId: startSync
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
            examples:
              incremental:
                summary: 增量同步全部启用账号（字段来自 docs/05 §7.1）
