  /calls:
    get:
      tags: [calls]
      summary: 话单列表
      description: |
        话单列表（对应图中 `getOutboundList → outboundList`），对应 docs/05 §6.2。
        返回 CallSummary[]（docs/05 §2.5）+ `meta.pagination`；多账号结果按 `accountId + upstreamCallId` 去重后聚合。
      operationId: listCalls
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: accountId
          in: query
          required: false
          description: 账号过滤（多账号聚合时可用逗号分隔）
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 话单状态过滤（单个或逗号分隔，如 `connected,ended`；取值见 CallStatus）
          schema:
            type: string
        - name: pipeline.audio
          in: query
          required: false
          description: 按录音阶段状态过滤（取值见 PipelineStageStatus）
          schema:
            $ref: '#/components/schemas/PipelineStageStatus'
        - name: pipeline.transcript
          in: query
          required: false
          description: 按转写阶段状态过滤（取值见 PipelineStageStatus）
          schema:
            $ref: '#/components/schemas/PipelineStageStatus'
        - name: pipeline.analysis
          in: query
          required: false
          description: 按分析阶段状态过滤（取值见 PipelineStageStatus）
          schema:
            $ref: '#/components/schemas/PipelineStageStatus'
        - name: hasAudio
          in: query
          required: false
          description: 是否有归档录音
          schema:
            type: boolean
        - name: hasTranscript
          in: query
          required: false
          description: 是否有转写
          schema:
            type: boolean
        - name: to
          in: query
          required: false
          description: 被叫号码过滤（支持后 4 位模糊，如 `*1234`；查询串中的号码同样按脱敏值返回）
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: 全文搜索：客户名/号码/转写全文（≤64 字符；v1 为归一化全文 LIKE，见 docs/04）
          schema:
            type: string
            maxLength: 64
        - name: dateFrom
          in: query
          required: false
          description: '`startedAt` 日期区间起（`YYYY-MM-DD`，含端点，Asia/Shanghai）；注意 `to` 已用于被叫号码'
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: '`startedAt` 日期区间止（`YYYY-MM-DD`，含端点，Asia/Shanghai）'
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          description: 排序：允许 `createdAt`/`dialedAt`/`endedAt`/`durationSec`，前缀 `-` 表示降序
          schema:
            type: string
            pattern: '^-?(createdAt|dialedAt|endedAt|durationSec)$'
            default: '-createdAt'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          required: false
          description: 每页条数（默认 20，最大 100）
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: includePipeline
          in: query
          required: false
          description: 是否返回 pipeline 状态（false 时 pipeline 全为 null，减少体积）
          schema:
            type: boolean
            default: true
      x-side-effects: []
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, VALIDATION_FAILED, DB_UNAVAILABLE, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 话单列表（分页）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CallSummary'
                  - type: object
                    required: [meta]
                    properties:
                      meta:
                        $ref: '#/components/schemas/PagedMeta'
              examples:
                calls:
                  summary: 话单列表（docs/05 §6.2 示例，号码脱敏）
                  value:
                    ok: true
                    data:
                      - callId: call_01J8Z3K5T9QW2M4R7X1C6V0B8N
                        accountId: main
                        upstreamCallId: "2121158093386702849"
                        direction: outbound
                        to:
                          phone: "186****3330"
                          location: 河北 衡水
                        from:
                          phone: "156****0075"
                          location: 北京 北京
                        lineNumber: "180****0053"
                        customerName: null
                        lineId: "9"
                        lineName: 回拨专线
                        status: ended
                        dialedAt: "2026-11-13T16:27:58+08:00"
                        answeredAt: "2026-11-13T16:27:58+08:00"
                        endedAt: "2026-11-13T16:28:13+08:00"
                        durationSec: 15
                        cost: 0.14
                        upstreamStatus:
                          callStatus: 1
                          callStatusName: 已接通
                          finishStatus: 4
                          finishStatusName: 其他
                        pipeline:
                          audio: ready
                          transcript: ready
                          analysis: ready
                          lastError: null
                        transcriptPreview: 喂。喂，李总，你好。嗯。我是看你们阿里做了很多年了…
                        audioAvailable: true
                        createdAt: "2026-11-13T16:27:53+08:00"
                        updatedAt: "2026-11-13T16:30:00+08:00"
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
                      pagination:
                        page: 1
                        size: 20
                        total: 1073
                        totalPages: 54
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [calls]
      summary: 发起呼出
      description: |
        发起呼出（对应图中 `Dail`），对应 docs/05 §6.1。异步受理：通过校验后进入 `pending`，
        由调度器在拨打时段内提交上游。**回拨模式**：先振铃坐席手机（telA），坐席接听后桥接客户（telB）。

        **真实副作用与计费**：每次成功提交都会产生真实外呼与上游话费；上游无幂等键，本地幂等为唯一保护，
        客户端禁止盲目重试，失败后先 `GET /calls?to=` 核对是否已产生话单。

        **校验顺序**：参数/号码格式 → 幂等键 → 账号存在且 enabled、会话健康 → 拨打时段
        （`dialWindow.open`；`scheduleOutsideWindow=true` 时允许入队等待，否则 422）→ 同 `accountId+to`
        防重（`dialCooldownMs`）→ 账号级并发（回拨串行）→ 上游号码查重 `getExistOther`
        （命中不阻断，仅在 `details.warnings` 返回 `number_exists_in_crm`）。

        **响应**：v1 默认同步受理返回 201（CallSummary）；保留 202 异步能力；`dryRun=true` 时返回 200
        且不产生 Call。响应头 `Idempotency-Key` 重复请求命中时 `meta.idempotencyReplayed=true`。
      operationId: dialCall
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialRequest'
      x-side-effects: [real-outbound-call, may-consume-upstream-billing, creates-call-record, enqueues-jobs]
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, INVALID_REQUEST, VALIDATION_FAILED, ACCOUNT_NOT_FOUND, ACCOUNT_DISABLED, ACCOUNT_BUSY, ACCOUNT_LOGIN_REQUIRED, CALL_OUTSIDE_DIAL_WINDOW, CALL_NOT_DIALABLE, IDEMPOTENCY_CONFLICT, CALL_REJECTED_BY_UPSTREAM, UPSTREAM_AUTH_EXPIRED, UPSTREAM_UNREACHABLE, UPSTREAM_BUSINESS_ERROR, UPSTREAM_RESPONSE_INVALID, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '201':
          description: 呼出已受理（v1 默认，data = CallAccepted（= CallSummary），status=pending）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CallAccepted'
              examples:
                accepted:
                  summary: 呼出受理（docs/05 §6.1 示例，号码脱敏；data = CallAccepted = CallSummary）
                  value:
                    ok: true
                    data:
                      callId: call_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      accountId: main
                      upstreamCallId: null
