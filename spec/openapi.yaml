openapi: 3.1.0

info:
  title: 飞鸽外呼本地平台（FOP）REST v1 API
  version: 0.3.0
  summary: REST v1 机器可读契约（35 个操作）
  description: |
    本文件是 `docs/05-对外API契约.md` 的机器可读副本（OpenAPI 3.1）；人类可读权威契约以
    `docs/05-对外API契约.md` + `docs/01-决策与约定.md` 为准，冲突时以文档为准并在评审中回改。
    spec 本身不新增 docs/05 未定义的字段，未明确处以 optional / nullable 保守建模（见 spec/README.md「待确认」）。

    - Base URL：`http://127.0.0.1:8710/api/v1`（默认仅监听 127.0.0.1，端口可配置）。
    - 认证：所有操作需要 `Authorization: Bearer <localApiToken>`（见 securitySchemes.bearerAuth）。
    - 封套：成功 `{ ok: true, data, meta }`；失败 `{ ok: false, error, meta }`；`meta.pagination` 仅列表接口出现。
    - 错误码：`ErrorObject.code` 枚举来自 `docs/01-决策与约定.md` §5.4（40 个稳定码，新增只增不改；
      适配层/后台作业的内部错误码不对外，必须归一为上述稳定码之一（docs/01 §5.4 注））；
      每个操作通过 `x-error-codes` 列出 docs/05 允许的业务错误码，供契约测试与 SDK 生成使用。
    - 全局错误：`429 RATE_LIMITED` 适用于全部接口（见共享 TooManyRequests 响应）；
      `503 SERVICE_UNAVAILABLE` 表示本地服务暂不可用（启动中/优雅关闭/传输被中断）。
    - 写接口 data 采用 docs/05 §2.14 定义的操作结果 DTO（CallAccepted/DryRunResult/AccountCreateResult/
      AccountLoginResult/AccountLoginAccepted/SyncAccepted/ReprocessAccepted/TermReplaceResult/NormalizeResult/WebhookTestResult）。
    - v1 转写**全部由本地自建 ASR（MiniMax asr-1.0）生成**，不使用上游转写；AI 后处理为 DeepSeek 内置 pipeline
      （docs/13）。故 `TranscriptSource` 固定 `asr`，错误码中已删除 `UPSTREAM_TRANSCRIPT_PENDING`。
    - 时间：ISO 8601 带时区（+08:00）；日期过滤用 `YYYY-MM-DD`（Asia/Shanghai）。ID 规则见 docs/01 §5.6。
    - 幂等：写接口可带 `Idempotency-Key`；重放响应 `meta.idempotencyReplayed=true`（docs/05 §1.2/§9）。
    - 上游原始值（毫秒时间戳、雪花 ID、原始状态码）只在 `upstream` 对象中出现，不参与本地业务判断。
    - 安全：示例中的手机号一律脱敏（如 `138****0000`）；禁止在示例/日志中出现真实密码、JWT、完整手机号。
    - 契约版本 v0.1（2026-11-14）；破坏性变更升级 `/api/v2`，变更流程见 docs/05 §11。
  externalDocs:
    description: 人类可读权威契约（docs/05-对外API契约.md）
    url: ../docs/05-对外API契约.md

servers:
  - url: http://127.0.0.1:8710/api/v1
    description: 本地默认地址（端口可配置，默认 8710；默认仅监听 127.0.0.1）

security:
  - bearerAuth: []

tags:
  - name: platform
    description: 平台自身健康与配置（health / status / config）
  - name: accounts
    description: 上游账号注册、登录、健康与移除（账号池）
  - name: calls
    description: 呼出（真实外呼，有副作用/计费）与话单、录音、转写、事件
  - name: sync
    description: 上游话单同步作业
  - name: jobs
    description: 后台作业（login/sync/audio_fetch/asr/analysis/reprocess/backfill；v1 已删除 transcript_fetch/transcript_pending_wait）
  - name: events
    description: 事件历史查询与 SSE 事件流
  - name: webhooks
    description: 出站 webhook 测试（v1 可选）
  - name: terms
    description: 领域词表归一规则
  - name: text
    description: 文本归一化工具（同步、无副作用）

paths:
  /health:
    get:
      tags: [platform]
      summary: 存活探针
      description: |
        存活探针（不做上游检查，快速返回），对应 docs/05 §4.1。
        仅返回进程存活与版本信息；平台完整健康见 GET /status。
      operationId: getHealth
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      x-side-effects: []
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 服务存活
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthPayload'
              examples:
                alive:
                  summary: 存活（docs/05 §4.1 示例）
                  value:
                    ok: true
                    data:
                      ok: true
                      uptimeSec: 3610
                      version: "0.1.0"
                      startedAt: "2026-11-14T09:00:00+08:00"
                    meta:
                      requestId: req_01J8Z3K5T9QW2M4R7X1C6V0B8N
                      ts: "2026-11-14T10:00:00+08:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /status:
    get:
      tags: [platform]
      summary: 平台状态
      description: |
        平台自身健康（对应图中 `getStatus → Status`）：进程、DB、账号池、上游可达、拨打时段、
        队列积压、同步延迟，对应 docs/05 §4.2。响应 `data` 为 StatusPayload（docs/05 §2.11）。
      operationId: getStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: detail
          in: query
          required: false
          description: 是否返回 `accountsDetail` 全量账号摘要（默认 true；账号数 >200 时服务端可只返回聚合）
          schema:
            type: boolean
            default: true
      x-side-effects: []
      x-idempotent: true
      x-error-codes: [UNAUTHORIZED, DB_UNAVAILABLE, INTERNAL_ERROR, RATE_LIMITED, SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: 平台状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusPayload'
              examples:
                status:
                  summary: 平台状态（docs/05 §4.2 示例，accountsDetail 按 AccountSummary 必填字段补全）
                  value:
                    ok: true
                    data:
                      version: "0.1.0"
