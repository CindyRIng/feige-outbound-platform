        '202':
          description: 已受理同步作业
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Api-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncAccepted'
              examples:
